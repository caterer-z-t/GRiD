samples_file: "path/to/sample_ids.txt"
directory_loc: "path/to/crams/"
reference_genome: "path/to/hg38.fa"
output_dir: "path/to/output/"
threads: 4
file_type: "cram"

# VNTR region of interest
chrom: "chr6"
start_bp: 160605062
end_bp: 160647661

output_file_type: "tsv"

index:
  run: False
  output_file_prefix: "index_file_results"

count_reads:
  run: True
  output_file_prefix: "read_counts"
  min_mapq: 1
  flags:
    - 83   # proper pair, reverse strand
    - 99   # mate forward, reverse strand (unpaired-ish)
    - 147  # proper pair, mate reverse
    - 163  # mate forward, reverse strand (unpaired-ish)
    - 81   # reverse, mate forward (unpaired-ish)
    - 97   # forward, mate reverse (unpaired-ish)
    - 145  # mate reverse
    - 161  # mate forward

mosdepth:
  run: True
  output_file_prefix: "mosdepth_results"
  bin_size: 1000
  work_dir: "path/to/mosdepth_work/"
  remove_intermediate: True
  example_bed: null

  normalize:
    run: True
    output_file_prefix: "ID_scale_zdepths"
    combined_bins_gz: null  # optional, defaults to output_dir/mosdepth_bins.txt.gz
    repeat_mask_file: "path/to/repeat_mask_list.hg38.ucsc_bed"

  neighbors:
    run: True
    output_file_prefix: "neighbor_coverage"
    num_neighbors: 5
    zmax: 2.0
    sigma2_max: 1000

compute_diploid_genotypes:
  run: True
  output_file_prefix: "diploid_genotypes"
  n_nbr: 300

compute_haploid_genotypes:
  run: True
  output_file_prefix: "haploid_genotypes"
  method: "ibs"          # "ibs" or "ibd"
  min_neighbors: 1
  max_neighbors: 10
  n_iters: 100

  # IBS method: provide computeIBSpbwt output
  ibs_output: "path/to/ibs_neighbors_chr6.tsv.gz"

  # IBD method: provide iLASH output and filtering thresholds
  # ibd_output: "path/to/ilash_output.txt"
  # weighted: False         # True = Lorentzian distance+match weighting
  # weight_scale: 1000000   # bp half-width for distance weight
  # min_length: 0.5         # minimum IBD segment length (cM)
  # min_match: 0.70         # minimum IBD match score
